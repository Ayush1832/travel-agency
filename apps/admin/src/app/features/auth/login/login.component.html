<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><mat-icon>admin_panel_settings</mat-icon></div>
    <h1>Admin Panel</h1>
    <p class="subtitle">Travel B2B Platform</p>

    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="admin@platform.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading || form.invalid">
        {{ loading ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
