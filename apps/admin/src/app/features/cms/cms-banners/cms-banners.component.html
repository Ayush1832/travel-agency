<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">CMS Banners</h1>
    <button mat-flat-button color="primary" (click)="openForm()">
      <mat-icon>add</mat-icon> New Banner
    </button>
  </div>

  <mat-card>
    <div *ngIf="loading" class="loading-row"><mat-spinner diameter="36"></mat-spinner></div>
    <table mat-table [dataSource]="banners" class="full-width" *ngIf="!loading">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let b"><strong>{{ b.title }}</strong></td>
      </ng-container>
      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef>Preview</th>
        <td mat-cell *matCellDef="let b">
          <img *ngIf="b.imageUrl" [src]="b.imageUrl" [alt]="b.altText" class="banner-thumb">
          <span *ngIf="!b.imageUrl">—</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let b">
          <span class="status-chip" [ngClass]="b.isActive ? 'chip-active' : 'chip-suspended'">
            {{ b.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
      </ng-container>
      <ng-container matColumnDef="sortOrder">
        <th mat-header-cell *matHeaderCellDef>Sort Order</th>
        <td mat-cell *matCellDef="let b">{{ b.sortOrder }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let b">
          <button mat-icon-button color="primary" (click)="openForm(b)" matTooltip="Edit"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="deleteBanner(b._id)" matTooltip="Delete"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <div *ngIf="!loading && banners.length === 0" class="empty-state">
      <mat-icon>image</mat-icon><p>No banners yet</p>
    </div>
  </mat-card>
</div>
