<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><mat-icon>lock_reset</mat-icon></div>
    <h1>Reset Password</h1>

    <div *ngIf="sent" class="alert alert-success">
      If that email is registered, a reset link has been sent.
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!sent">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="agency@example.com" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading || form.invalid">
        {{ loading ? 'Sending…' : 'Send Reset Link' }}
      </button>
    </form>

    <p class="auth-footer"><a routerLink="/auth/login">Back to sign in</a></p>
  </div>
</div>
