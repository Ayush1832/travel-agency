<div class="auth-page">
  <div class="auth-card auth-card--wide">
    <h1>Request Agency Access</h1>
    <p class="subtitle">Fill in your business details. Our team will review and activate your account.</p>

    <div class="alert alert-success" *ngIf="success">{{ success }}</div>
    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!success">
      <div class="form-row">
        <div class="form-group">
          <label>Company Name *</label>
          <input type="text" formControlName="companyName" placeholder="ABC Travel LLC" />
        </div>
        <div class="form-group">
          <label>Contact Person *</label>
          <input type="text" formControlName="contactPerson" placeholder="John Smith" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Business Email *</label>
          <input type="email" formControlName="email" placeholder="john@abctravel.com" />
        </div>
        <div class="form-group">
          <label>Phone *</label>
          <input type="tel" formControlName="phone" placeholder="+971 50 000 0000" />
        </div>
      </div>

      <div class="form-group">
        <label>Address *</label>
        <input type="text" formControlName="addressLine1" placeholder="Office 101, Business Bay" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>City *</label>
          <input type="text" formControlName="city" placeholder="Dubai" />
        </div>
        <div class="form-group">
          <label>Country *</label>
          <input type="text" formControlName="country" placeholder="UAE" />
        </div>
        <div class="form-group">
          <label>Postal Code *</label>
          <input type="text" formControlName="postalCode" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Preferred Currency</label>
          <select formControlName="currency">
            <option value="AED">AED (UAE Dirham)</option>
            <option value="USD">USD (US Dollar)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" formControlName="password" placeholder="Min 8 characters" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading || form.invalid">
        {{ loading ? 'Submitting…' : 'Submit Registration' }}
      </button>
    </form>

    <p class="auth-footer">
      Already registered? <a routerLink="/auth/login">Sign in</a>
    </p>
  </div>
</div>
