name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace=server --ignore-scripts
      - run: npm test --workspace=server -- --no-coverage --passWithNoTests

  build:
    name: Build Frontend Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build client app
        working-directory: apps/client
        run: |
          npm install --legacy-peer-deps --ignore-scripts
          npx ng build --configuration production

      - name: Build admin app
        working-directory: apps/admin
        run: |
          npm install --legacy-peer-deps --ignore-scripts
          npx ng build --configuration production

      - name: Package builds
        run: |
          tar -czf client.tar.gz -C apps/client/dist/client/browser .
          tar -czf admin.tar.gz -C apps/admin/dist/admin/browser .

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-builds
          path: |
            client.tar.gz
            admin.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-builds
          path: .

      - name: Copy frontend builds to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "client.tar.gz,admin.tar.gz"
          target: "/tmp/"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            echo "── Deploying client frontend ──"
            rm -rf /var/www/unlimited.travel/*
            tar -xzf /tmp/client.tar.gz -C /var/www/unlimited.travel/

            echo "── Deploying admin frontend ──"
            rm -rf /var/www/admin.unlimited.travel/*
            tar -xzf /tmp/admin.tar.gz -C /var/www/admin.unlimited.travel/

            chown -R www-data:www-data /var/www/unlimited.travel /var/www/admin.unlimited.travel
            rm -f /tmp/client.tar.gz /tmp/admin.tar.gz

            echo "── Updating backend ──"
            cd ~/travel-agency
            git fetch origin main
            git reset --hard origin/main
            docker compose -f infra/docker-compose.yml up -d --build server

            echo "── Writing Nginx config ──"
            cat > /etc/nginx/sites-available/unlimited.travel << 'NGINX_EOF'
            server {
                listen 80;
                listen [::]:80;
                server_name unlimited.travel www.unlimited.travel admin.unlimited.travel;
                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl;
                listen [::]:443 ssl;
                server_name unlimited.travel www.unlimited.travel;

                ssl_certificate /etc/letsencrypt/live/unlimited.travel/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/unlimited.travel/privkey.pem;

                # SSL performance
                ssl_session_cache   shared:SSL:10m;
                ssl_session_timeout 1d;
                ssl_protocols       TLSv1.2 TLSv1.3;

                # Gzip compression — reduces JS/CSS ~75%
                gzip on;
                gzip_vary on;
                gzip_proxied any;
                gzip_comp_level 6;
                gzip_min_length 256;
                gzip_types
                    text/plain text/css text/xml text/javascript
                    application/javascript application/json application/xml
                    application/rss+xml font/ttf font/otf font/woff font/woff2
                    image/svg+xml;

                root /var/www/unlimited.travel;
                index index.html;

                location /api/ {
                    proxy_pass http://localhost:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location = /index.html {
                    add_header Cache-Control "no-cache, no-store, must-revalidate";
                }

                # Hashed JS/CSS/fonts — cache for 1 year
                location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff2?|ttf|eot|svg)$ {
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                    access_log off;
                }

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }

            server {
                listen 443 ssl;
                listen [::]:443 ssl;
                server_name admin.unlimited.travel;

                ssl_certificate /etc/letsencrypt/live/admin.unlimited.travel/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/admin.unlimited.travel/privkey.pem;

                ssl_session_cache   shared:SSL:10m;
                ssl_session_timeout 1d;
                ssl_protocols       TLSv1.2 TLSv1.3;

                gzip on;
                gzip_vary on;
                gzip_proxied any;
                gzip_comp_level 6;
                gzip_min_length 256;
                gzip_types
                    text/plain text/css text/xml text/javascript
                    application/javascript application/json application/xml
                    application/rss+xml font/ttf font/otf font/woff font/woff2
                    image/svg+xml;

                root /var/www/admin.unlimited.travel;
                index index.html;

                location /api/ {
                    proxy_pass http://localhost:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location = /index.html {
                    add_header Cache-Control "no-cache, no-store, must-revalidate";
                }

                location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff2?|ttf|eot|svg)$ {
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                    access_log off;
                }

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            NGINX_EOF

            echo "── Reloading Nginx ──"
            nginx -t && systemctl reload nginx

            echo "── Deploy complete ──"
