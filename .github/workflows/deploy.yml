name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install server dependencies
        run: npm ci --workspace=server --ignore-scripts

      - name: Run tests
        run: npm test --workspace=server -- --no-coverage --passWithNoTests

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/travel-agency

            echo "── Pulling latest code ──"
            git fetch origin main
            git reset --hard origin/main

            echo "── Rebuilding backend (Docker) ──"
            docker compose -f infra/docker-compose.yml up -d --build server

            echo "── Rebuilding client app ──"
            cd apps/client
            HUSKY=0 npm install --legacy-peer-deps --ignore-scripts
            npx ng build --configuration production
            cd ../..

            echo "── Rebuilding admin app ──"
            cd apps/admin
            HUSKY=0 npm install --legacy-peer-deps --ignore-scripts
            npx ng build --configuration production
            cd ../..

            echo "── Copying builds to /var/www/ ──"
            mkdir -p /var/www/unlimited.travel
            mkdir -p /var/www/admin.unlimited.travel
            rm -rf /var/www/unlimited.travel/*
            rm -rf /var/www/admin.unlimited.travel/*
            cp -r /root/travel-agency/apps/client/dist/client/browser/. /var/www/unlimited.travel/
            cp -r /root/travel-agency/apps/admin/dist/admin/browser/. /var/www/admin.unlimited.travel/
            chown -R www-data:www-data /var/www/unlimited.travel /var/www/admin.unlimited.travel

            echo "── Writing Nginx config ──"
            cat > /etc/nginx/sites-available/unlimited.travel << 'NGINX_EOF'
            server {
                listen 80;
                listen [::]:80;
                server_name unlimited.travel www.unlimited.travel admin.unlimited.travel;
                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl;
                listen [::]:443 ssl;
                server_name unlimited.travel www.unlimited.travel;

                ssl_certificate /etc/letsencrypt/live/unlimited.travel/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/unlimited.travel/privkey.pem;

                root /var/www/unlimited.travel;
                index index.html;

                location /api/ {
                    proxy_pass http://localhost:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }

            server {
                listen 443 ssl;
                listen [::]:443 ssl;
                server_name admin.unlimited.travel;

                ssl_certificate /etc/letsencrypt/live/admin.unlimited.travel/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/admin.unlimited.travel/privkey.pem;

                root /var/www/admin.unlimited.travel;
                index index.html;

                location /api/ {
                    proxy_pass http://localhost:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            NGINX_EOF

            echo "── Reloading Nginx ──"
            nginx -t && systemctl reload nginx

            echo "── Deploy complete ──"
